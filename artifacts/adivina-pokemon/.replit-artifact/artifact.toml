kind = "web"
previewPath = "/"
title = "Pistamon"
description = "A Spanish-language Gen 1 Pokémon guessing game. A random Pokémon is chosen and the player has 4 attempts to guess it. Three progressive hints are revealed on wrong guesses. Includes the full 151-Pokémon Gen 1 Pokédex with Spanish clues."
version = "1.0.0"
id = "artifacts/adivina-pokemon"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22465

[services.development]
run = "pnpm --filter @workspace/adivina-pokemon run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adivina-pokemon", "run", "build" ]
serve = "static"
publicDir = "artifacts/adivina-pokemon/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22465"
BASE_PATH = "/"
